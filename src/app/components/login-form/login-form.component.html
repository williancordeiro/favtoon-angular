<form class="form" #formRef="ngForm" (ngSubmit)="onSubmit(formRef)">
    <div class="form-group" [innerHTML]="errorMessage" class="warning"></div>
    <div class="form-group">
        <input type="text" id="email" name="email" [ngClass]="{ 'invalid-input': invalidInput.email }" [(ngModel)]="user.email" placeholder="Email. . ." required>
    </div>
    <div class="form-group">
        <input type="password" id="password" name="password" name="email" [ngClass]="{ 'invalid-input': invalidInput.password }" [(ngModel)]="user.password" placeholder="Password. . ." required>
        <div class="link">
            <a routerLink="/forgot-password">Forgot Password?</a>
        </div>
    </div>
    <div class="form-group">
        <button class="btn primary" type="submit">Login</button>
    </div>
</form>
