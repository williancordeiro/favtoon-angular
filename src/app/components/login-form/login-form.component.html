<form class="form" (ngSubmit)="onSubmit()">
    <div class="form-group" [innerHTML]="errorMessage"></div>
    <div class="form-group">
        <input type="text" id="email" name="email" [(ngModel)]="user.email" placeholder="Email. . ." required>
    </div>
    <div class="form-group">
        <input type="password" id="password" name="password" [(ngModel)]="user.password" placeholder="Password. . ." required>
        <div class="link">
            <a routerLink="/forgot-password">Forgot Password?</a>
        </div>
    </div>
    <div class="form-group">
        <button class="btn primary" type="submit">Login</button>
    </div>
</form>
