<form class="form" #formRef="ngForm" (ngSubmit)="onSubmit(formRef)">
    <div class="form-group" [innerHTML]="errorMessage" class="warning"></div>
    <div class="form-group">
        <input [ngClass]="{ 'invalid-input': invalidInput.name }" type="text" id="name" name="name" [(ngModel)]="user.name" placeholder="Name. . ." required>
    </div>
    <div class="form-group">
        <input [ngClass]="{ 'invalid-input': invalidInput.email }" type="text" id="email" name="email" [(ngModel)]="user.email" placeholder="Email. . ." required>
    </div>
    <div class="form-group">
        <input [ngClass]="{ 'invalid-input': invalidInput.password }" (input)="onPasswordInput()" type="password" id="password" name="password" [(ngModel)]="user.password" placeholder="Password. . ." required>
        <div [innerHTML]="errorPassMessage" class="password-options"></div>
    </div>
    <div class="form-group">
        <input [ngClass]="{ 'invalid-input': invalidInput.confirmPassword }" type="password" (input)="onPassConfirmInput()" id="confirmPass" name="confirmPassword" [(ngModel)]="user.confirmPassword" placeholder="Confirm Password. . ." required>
        <div [innerHTML]="errorPassConfiMessage" class="password-options"></div>
    </div>
    <div class="form-group">
        <button class="btn primary" type="submit">Register</button>
    </div>
</form>
