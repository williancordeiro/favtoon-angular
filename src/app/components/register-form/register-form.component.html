<form class="form" (ngSubmit)="onSubmit()">
    <div class="form-group" [innerHTML]="errorMessage"></div>
    <div class="form-group">
        <input type="text" id="name" name="name" [(ngModel)]="user.name" placeholder="Name. . ." required>
    </div>
    <div class="form-group">
        <input type="text" id="email" name="email" [(ngModel)]="user.email" placeholder="Email. . ." required>
    </div>
    <div class="form-group">
        <input type="password" id="password" name="password" [(ngModel)]="user.password" placeholder="Password. . ." required>
    </div>
    <div class="form-group">
        <input type="password" id="confirmPass" name="confirmPassword" [(ngModel)]="user.confirmPassword" placeholder="Confirm Password. . ." required>
    </div>
    <div class="form-group">
        <button class="btn primary" type="submit">Register</button>
    </div>
</form>
