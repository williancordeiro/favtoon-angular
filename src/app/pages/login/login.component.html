<div class="container form-container">
    <h2 class="title">Login</h2>
    <app-login-form 
        (loginSuccess)="onLoginSuccess($event)"
        (loginError)="onLoginError($event)" />
    
    <div class="link">
        <p>Don't have an account? <a routerLink="/register">Register here</a></p>
    </div>
</div>
