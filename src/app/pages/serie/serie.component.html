<div class="serie-container">
  <div class="header">
    <button class="btn-back" (click)="goBack()">
      <span>←</span> Back
    </button>
  </div>

  
  <div class="messages" *ngIf="errorMessage || successMessage">
    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>
  </div>

  <div class="serie-form" *ngIf="serie.id">
    <div class="image-section">
      <div class="image-container" (click)="triggerFileInput()">
        <img 
          [src]="imagePreviewUrl || 'assets/images/default.png'" 
          alt="Serie image"
          class="serie-image">
        <div class="image-overlay" [class.editing]="isEditing">
          <span>{{ isEditing ? 'Click to change image' : serie.title }}</span>
        </div>
      </div>
      
      <input 
        #fileInput
        type="file" 
        accept="image/*"
        (change)="onFileSelected($event)"
        style="display: none;">
    </div>

    
    <div class="form-fields">
      <div class="field-group">
        <label for="title">Title:</label>
        <input 
          id="title"
          type="text" 
          [(ngModel)]="serie.title"
          [disabled]="!isEditing"
          class="form-input"
          placeholder="Serie name">
      </div>

      <div class="field-group">
        <label for="year">Year:</label>
        <input 
          id="year"
          type="number" 
          [(ngModel)]="serie.year"
          [disabled]="!isEditing"
          class="form-input"
          placeholder="Release year">
      </div>

      <div class="field-group">
        <label for="genre">Genre:</label>
        <input 
          id="genre"
          type="text" 
          [(ngModel)]="serie.genre"
          [disabled]="!isEditing"
          class="form-input"
          placeholder="Serie genre">
      </div>

      <div class="field-group">
        <label for="seasons">Seasons:</label>
        <input 
          id="seasons"
          type="number" 
          [(ngModel)]="serie.seasons"
          [disabled]="!isEditing"
          class="form-input"
          min="1"
          placeholder="Number of seasons">
      </div>

      <div class="field-group">
        <label for="synopsis">Synopsis:</label>
        <textarea 
          id="synopsis"
          [(ngModel)]="serie.synopsis"
          [disabled]="!isEditing"
          class="form-textarea"
          rows="4"
          placeholder="Serie synopsis"></textarea>
      </div>
    </div>

    <div class="action-buttons">
      <button 
        *ngIf="!isEditing" 
        class="btn-edit" 
        (click)="toggleEdit()">
        Edit Serie
      </button>
      
      <div *ngIf="isEditing" class="edit-buttons">
        <button 
          class="btn-cancel" 
          (click)="toggleEdit()">
          Cancel
        </button>
        <button 
          class="btn-save" 
          (click)="saveSerie()">
          Save
        </button>
      </div>
    </div>
  </div>

  <div class="loading" *ngIf="!serie.id && !errorMessage">
    <p>Loading serie...</p>
  </div>
</div>
