<div class="serie-container">
  <div class="header">
    <button class="btn-back" (click)="goBack()">
      <span>←</span> Back
    </button>
  </div>

  
  <div class="messages" *ngIf="errorMessage || successMessage">
    <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
    <div class="success-message" *ngIf="successMessage">{{ successMessage }}</div>
  </div>

  <div class="serie-form" *ngIf="serie.id">
    <form [formGroup]="serieForm">
      <div class="image-section">
        <div class="image-container" (click)="triggerFileInput()">
          <img 
            [src]="imagePreviewUrl || 'assets/images/default.png'" 
            alt="Serie image"
            class="serie-image">
          <div class="image-overlay" [class.editing]="isEditing">
            <span>{{ isEditing ? 'Click to change image' : serie.title }}</span>
          </div>
        </div>
        
        <input 
          #fileInput
          type="file" 
          accept="image/*"
          (change)="onFileSelected($event)"
          style="display: none;">
      </div>

      
      <div class="form-fields">
        <div class="field-group">
          <label for="title">Title:</label>
          <input 
            id="title"
            type="text" 
            formControlName="title"
            class="form-input"
            placeholder="Serie name">
          <div *ngIf="serieForm.get('title')?.invalid && serieForm.get('title')?.touched" class="error-text">
            Title is required
          </div>
        </div>

        <div class="field-group">
          <label for="year">Year:</label>
          <select 
            id="year"
            formControlName="year"
            class="form-input"
            placeholder="Release year">
            <option value="" disabled>Select year...</option>
            <option *ngFor="let year of years" [value]="year">{{ year }}</option>
          </select>
          <div *ngIf="serieForm.get('year')?.invalid && serieForm.get('year')?.touched" class="error-text">
            Year is required
          </div>
        </div>

        <div class="field-group">
          <label for="genre">Genre:</label>
          <input 
            id="genre"
            type="text" 
            formControlName="genre"
            class="form-input"
            placeholder="Serie genre">
          <div *ngIf="serieForm.get('genre')?.invalid && serieForm.get('genre')?.touched" class="error-text">
            Genre is required
          </div>
        </div>

        <div class="field-group">
          <label for="seasons">Seasons:</label>
          <input 
            id="seasons"
            type="number" 
            formControlName="seasons"
            class="form-input"
            min="1"
            placeholder="Number of seasons">
          <div *ngIf="serieForm.get('seasons')?.invalid && serieForm.get('seasons')?.touched" class="error-text">
            Seasons is required and must be at least 1
          </div>
        </div>

        <div class="field-group">
          <label for="synopsis">Synopsis:</label>
          <textarea 
            id="synopsis"
            formControlName="synopsis"
            class="form-textarea"
            rows="4"
            placeholder="Serie synopsis"></textarea>
        </div>
      </div>

      <div class="action-buttons">
        <div *ngIf="!isEditing" class="view-buttons">
          <button 
            class="btn primary" 
            (click)="toggleEdit()">
            Edit Serie
          </button>
          <button 
            class="btn danger" 
            (click)="deleteSerie()">
            Delete
          </button>
        </div>
        
        <div *ngIf="isEditing" class="edit-buttons">
          <button 
            type="button"
            class="btn cancel" 
            (click)="toggleEdit()">
            Cancel
          </button>
          <button 
            type="button"
            class="btn success" 
            (click)="saveSerie()"
            [disabled]="!serieForm.valid">
            Save
          </button>
        </div>
      </div>
    </form>
  </div>

  <div class="loading" *ngIf="!serie.id && !errorMessage">
    <p>Loading serie...</p>
  </div>
</div>
